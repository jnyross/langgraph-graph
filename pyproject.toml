[project]
name = "langgraph-graph"
version = "0.1.0"
description = "Personal-automation runtime for AI agentic graphs with HITL interrupts, built on LangGraph."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "John" }]
license = { text = "MIT" }

dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.30",
    "langchain-openai>=0.2.0",   # works with Ollama/MLX via OpenAI-compatible API
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
local = [
    # Optional local helpers
    "litellm>=1.50",        # multi-provider gateway
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_graph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
